<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burger Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<!-- Three.js se importa como módulo desde unpkg -->
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
  :root { --mar:#0f6b7a; --crema:#fff6e0; --mostaza:#ffc933; --mostaza-osc:#c99400; --tomate:#e2503a; --cafe:#5b3a00; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#8fd8d8; font-family:'Fredoka','Trebuchet MS',sans-serif; color:var(--cafe); user-select:none; touch-action:none; }
  #escena, #escena canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .oculto { display:none !important; }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; padding:env(safe-area-inset-top) 12px 12px; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding-top:10px; }
  .barra span { background:rgba(255,246,224,.92); border-radius:999px; padding:4px 14px; font-weight:700; font-size:clamp(.8rem,2.6vw,1.1rem); box-shadow:0 3px 0 rgba(91,58,0,.25); }
  #palabra { display:flex; gap:6px; justify-content:center; margin-top:10px; }
  #palabra span { width:clamp(30px,8vw,46px); height:clamp(36px,9vw,54px); display:grid; place-items:center; border-radius:12px; background:rgba(255,246,224,.55); color:transparent; font-size:clamp(1.2rem,4vw,1.9rem); font-weight:700; border:3px dashed var(--mostaza-osc); }
  #palabra span.ok { color:var(--cafe); background:var(--mostaza); border-style:solid; animation:salto .4s; }
  @keyframes salto { 50% { transform:translateY(-10px) scale(1.15); } }
  #mensaje { position:absolute; left:0; right:0; top:32%; text-align:center; font-size:clamp(1.6rem,6vw,3rem); font-weight:700; color:#fff; text-shadow:0 3px 0 var(--cafe); opacity:0; }
  #mensaje.mostrar { animation:aparece 1.4s ease-out; }
  @keyframes aparece { 0% { opacity:0; transform:scale(.6); } 20% { opacity:1; transform:scale(1.05); } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-20px); } }
  #efecto { position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,201,51,.5) 60%,transparent); opacity:0; }
  #efecto.flash { animation:destello .6s ease-out; }
  @keyframes destello { 0% { opacity:.95; } 100% { opacity:0; } }

  #jefe { position:absolute; left:50%; transform:translateX(-50%); top:64px; width:min(360px,80vw); height:22px; border-radius:12px; background:rgba(0,0,0,.45); border:3px solid var(--crema); overflow:hidden; }
  #jefeBarra { height:100%; width:100%; background:linear-gradient(#ff8080,#c0392b); transition:width .15s; }
  #sorteo { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); font-size:clamp(1.6rem,7vw,3.2rem); font-weight:700; color:#fff; background:rgba(15,107,122,.92); padding:.5em 1em; border-radius:28px; border:4px solid #5fd0ff; box-shadow:0 0 30px #5fd0ff; text-shadow:0 3px 0 var(--cafe); white-space:nowrap; pointer-events:none; }
  /* Pantallas y menús */
  #pantalla { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:rgba(15,107,122,.55); backdrop-filter:blur(4px); overflow:auto; }
  .panel { width:min(440px,100%); max-height:100%; overflow:auto; background:var(--crema); border-radius:28px; padding:22px 24px; text-align:center; box-shadow:0 8px 0 rgba(91,58,0,.3), 0 18px 40px rgba(0,0,0,.25); animation:entra .35s ease-out; }
  @keyframes entra { from { opacity:0; transform:translateY(24px) scale(.96); } }
  h1 { margin:.1em 0; font-size:clamp(2rem,8vw,3rem); color:var(--tomate); }
  h2 { margin:.2em 0 .5em; font-size:1.9rem; } h3 { margin:1em 0 .3em; font-size:1.1rem; }
  p { margin:.3em 0; } .sub { opacity:.8; } .ayuda { font-size:.8rem; opacity:.7; margin-top:1em; } .mon-tot { font-weight:700; }
  .aviso { color:var(--tomate); font-weight:700; min-height:1.2em; }
  button { font:inherit; font-weight:700; font-size:1.15rem; display:block; width:100%; margin:.5em 0; padding:.6em 1em; border:0; border-radius:18px; cursor:pointer; background:var(--mostaza); color:var(--cafe); box-shadow:0 5px 0 var(--mostaza-osc); transition:transform .1s, box-shadow .1s; }
  button:hover { transform:translateY(-2px); } button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--mostaza-osc); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--mar); outline-offset:2px; }
  button.sec { background:#fff; box-shadow:0 5px 0 #d8c9a5; }
  button.chico { display:inline-block; width:auto; margin:0; font-size:1rem; padding:.3em .9em; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:.45em .2em; border-bottom:2px dotted #e6d3a4; }
  .eq { color:#2f8a3d; } input { font:inherit; width:100%; padding:.6em; border-radius:14px; border:3px solid var(--mostaza-osc); margin:.5em 0; text-align:center; }
  .rank { text-align:left; margin:0; padding-left:1.6em; } .rank li { padding:.1em 0; } .rank b { float:right; }

  #vista { width:200px; height:200px; margin:0 auto 6px; border-radius:24px; background:radial-gradient(#fffdf5,#f6d38b); overflow:hidden; }
  #vista canvas { width:200px !important; height:200px !important; display:block; }
  /* Animación del menú de inicio: la hamburguesa corre y el villano la persigue */
  .anim { position:relative; height:90px; overflow:hidden; border-radius:18px; background:linear-gradient(#8fd8d8 60%,#f0cf8e 60%); margin-bottom:8px; }
  .anim span { position:absolute; font-size:2.2rem; bottom:8px; }
  .cang { left:10px; font-size:3rem !important; } .hamb { animation:corre 3s linear infinite, bota .3s ease-in-out infinite alternate; }
  .vill { animation:corre 3s linear infinite; animation-delay:-.5s; } .mon { bottom:38px !important; font-size:1.4rem !important; animation:brilla 1s ease-in-out infinite alternate; }
  .m1 { left:45%; } .m2 { left:70%; animation-delay:.4s; }
  @keyframes corre { from { left:-15%; } to { left:105%; } } @keyframes bota { to { margin-bottom:12px; } }
  @keyframes brilla { to { filter:brightness(1.6) drop-shadow(0 0 6px #ffd23f); transform:scale(1.2); } }
  @media (prefers-reduced-motion:reduce) { * { animation-duration:.01s !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
  <div id="escena"></div>
  <div id="hud" class="oculto">
    <div class="barra"><span id="hNivel"></span><span id="hVidas"></span><span id="hMon"></span><span id="hPts"></span><span id="hTiempo"></span><span id="hPot"></span></div>
    <div id="palabra"></div>
    <div id="jefe" class="oculto"><div id="jefeBarra"></div></div>
    <div id="mensaje"></div>
  </div>
  <div id="efecto"></div>
  <div id="sorteo" class="oculto"></div>
  <div id="pantalla"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
